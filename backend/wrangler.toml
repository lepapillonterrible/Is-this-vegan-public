# Cloudflare Workers configuration
# See: https://developers.cloudflare.com/workers/

name = "is-this-vegan-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Environment variables (set via Cloudflare dashboard or CLI)
# DO NOT commit actual values here
[vars]
GEMINI_MODEL = "gemini-2.5-flash"

# Secrets (set via: wrangler secret put GEMINI_API_KEY)
# These are encrypted and never exposed
# [secrets]
# GEMINI_API_KEY = "your-key-here"  # DON'T set here - use CLI

# Rate limiting (optional - requires KV namespace)
# Create a KV namespace with: wrangler kv:namespace create "RATE_LIMIT"
# Then replace YOUR_KV_NAMESPACE_ID below with the id from the output.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "YOUR_KV_NAMESPACE_ID"
