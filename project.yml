name: IsThisVegan

options:
  bundleIdPrefix: com.IsThisVegan.com
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: H99A45HA22
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  IsThisVegan:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.DS_Store"
      - path: Models
        excludes:
          - "*.DS_Store"
      - path: Services
        excludes:
          - "*.DS_Store"
      - path: ViewModels
        excludes:
          - "*.DS_Store"
      - path: Views
        excludes:
          - "*.DS_Store"
      - path: Resources
        excludes:
          - "!Secrets.plist"
    resources:
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.IsThisVegan.com
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: IsThisVegan.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: IsThisVegan.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.isthisvegan.shared
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.IsThisVegan.com

  IsThisVeganWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "*.DS_Store"
      - path: Assets.xcassets
      # Shared models needed by the widget
      - path: Models
        excludes:
          - "*.DS_Store"
      # Config needed for App Group identifier
      - path: "App/IsThisVegan - Config.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.IsThisVegan.com.Widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: IsThisVeganWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: IsThisVeganWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.isthisvegan.shared
    dependencies:
      - target: IsThisVegan
        embed: false
